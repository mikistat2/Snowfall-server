name: Neon usage alert

# Neon's Free plan allows 100 CU-hours per PROJECT per month. Running out
# means the database stops, which means the door stops opening. This gives
# roughly three weeks of warning instead of a 6am surprise.
on:
  schedule:
    - cron: '30 6 * * *' # 09:30 in Addis — read it with morning coffee
  workflow_dispatch:

env:
  QUOTA_CU_HOURS: '100' # Free plan, per project
  WARN_PERCENT: '60'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch consumption and alert on Telegram
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          for v in NEON_API_KEY TOKEN CHAT; do
            if [ -z "${!v:-}" ]; then echo "::error::secret $v is empty"; exit 1; fi
          done

          notify() {
            curl -fsS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT}" \
              --data-urlencode "text=$1" > /dev/null
          }

          # Billing periods reset on the 1st, so measure from the 1st. Neon
          # rounds `monthly` granularity to the start of the month anyway.
          FROM="$(date -u +%Y-%m-01T00:00:00Z)"
          TO="$(date -u +%Y-%m-%dT%H:00:00Z)"

          URL="https://console.neon.tech/api/v2/consumption_history/v2/projects"
          URL="${URL}?from=${FROM}&to=${TO}&granularity=monthly&metrics=compute_unit_seconds"
          if [ -n "${NEON_ORG_ID:-}" ]; then URL="${URL}&org_id=${NEON_ORG_ID}"; fi

          code=$(curl -sS -o resp.json -w '%{http_code}' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${NEON_API_KEY}" "$URL")

          # A monitor that reports "all clear" when it is itself broken is
          # worse than no monitor, so every failure path below alerts too.
          if [ "$code" != "200" ]; then
            msg=$(printf '%s\n%s\n\n%s' \
              "⚠️ Snowfall: could not read Neon usage (HTTP ${code})." \
              "The quota check did NOT run today — check NEON_API_KEY." \
              "$(head -c 300 resp.json || true)")
            notify "$msg"
            echo "::error::Neon API returned ${code}"
            exit 1
          fi

          if ! jq -e '.projects | type == "array" and length > 0' resp.json > /dev/null; then
            notify "$(printf '%s\n%s' \
              '⚠️ Snowfall: Neon returned no projects.' \
              'The quota check did NOT run today — the API response shape may have changed.')"
            echo "::error::unexpected response shape"
            exit 1
          fi

          # projects[] -> periods[] -> consumption[] -> metrics[]{metric_name,value}
          jq -r '
            .projects[]
            | .project_id as $p
            | [ .periods[].consumption[].metrics[]
                | select(.metric_name == "compute_unit_seconds") | .value ]
            | add // 0
            | "\($p) \(.)"
          ' resp.json > usage.txt

          day=$(date -u +%-d)
          days_in_month=$(date -u -d "$(date -u +%Y-%m-01) +1 month -1 day" +%-d)
          alerted=0
          total=0

          while read -r project cu_seconds; do
            total=$(awk -v t="$total" -v s="$cu_seconds" 'BEGIN{print t+s}')
            hours=$(awk -v s="$cu_seconds" 'BEGIN{printf "%.1f", s/3600}')
            pct=$(awk -v h="$hours" -v q="$QUOTA_CU_HOURS" 'BEGIN{printf "%.0f", (h/q)*100}')
            echo "${project}: ${hours} / ${QUOTA_CU_HOURS} CU-hours (${pct}%)"

            if [ "$pct" -ge "$WARN_PERCENT" ]; then
              alerted=1
              projected=$(awk -v h="$hours" -v d="$day" -v m="$days_in_month" \
                'BEGIN{printf "%.0f", h/d*m}')
              msg=$(printf '%s\n%s\n%s\n%s\n\n%s' \
                "⚠️ Neon usage: ${pct}% of quota" \
                "Project: ${project}" \
                "Used: ${hours} of ${QUOTA_CU_HOURS} CU-hours, ${day} days into the month." \
                "On this pace the month ends at ~${projected} CU-hours." \
                "Over ${QUOTA_CU_HOURS} means the database suspends and check-in stops until the 1st.")
              notify "$msg"
            fi
          done < usage.txt

          # A live database cannot have consumed exactly zero this month. If it
          # reads zero, `compute_unit_seconds` has been renamed or moved and
          # every number above is meaningless — say so rather than reporting
          # a comfortable 0%.
          if [ "$(awk -v t="$total" 'BEGIN{print (t > 0) ? 1 : 0}')" -eq 0 ]; then
            notify "$(printf '%s\n%s' \
              '⚠️ Snowfall: Neon reports 0 compute used this month.' \
              'That is not possible for a running database — the usage check is broken, not the usage.')"
            echo "::error::total consumption parsed as zero"
            exit 1
          fi

          if [ "$alerted" -eq 0 ]; then
            echo "all projects under ${WARN_PERCENT}% — staying quiet"
          fi
